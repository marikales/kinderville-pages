   Генерируется из сетки школы (make_leads_schedule.py); правки — в генератор. */
:root{
  --petrol:#1C7066; --petrol-d:#155a52; --petrol-x:#0e433d; --mint:#36A393; --orange:#F68C50; --yellow:#FFCB05;
  --ink:#1f2b28; --body:#43504a; --muted:#71807a; --hair:#e4e9e6; --line:#e9edeb;
  --paper:#f4f6f5; --card:#ffffff;
  --en-bg:#dff3ee; --en-fg:#0f6b5e; --ru-bg:#ffe8db; --ru-fg:#b3501d;
  --meal:#fff4e6; --calm:#edf4f1; --hw:#e7f0ee; --play:#fff7d6; --brk:#f1f4f3;
  --g:'Geologica',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f:'Albert Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55;
     -webkit-font-smoothing:antialiased;text-align:left}
a{color:var(--petrol)}
h1,h2,h3{font-family:var(--g);font-weight:600;color:var(--ink);margin:0}
p{margin:0 0 12px;color:var(--body)}
.i{width:1em;height:1em;fill:currentColor;flex:0 0 auto}
button{font-family:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}

/* ── шапка ── */
.top{padding:26px 0 8px;position:relative}
.top .logo{height:40px;width:auto;display:inline-block}
.langsw{position:absolute;right:18px;top:26px;display:inline-flex;background:#fff;border:1px solid var(--hair);
        border-radius:999px;padding:3px;box-shadow:0 2px 10px rgba(20,60,54,.06)}
.langsw button{background:transparent;border:0;border-radius:999px;color:var(--muted);font-family:var(--g);font-weight:600;
               font-size:12.5px;padding:6px 12px;cursor:pointer;letter-spacing:.6px}
.langsw button[aria-pressed="true"]{background:var(--petrol);color:#fff}
.intro{padding:20px 0 6px}
.kicker{display:inline-block;font-family:var(--g);font-weight:600;font-size:11.5px;letter-spacing:2.2px;text-transform:uppercase;
        color:var(--mint);margin:0 0 12px}
.intro h1{font-size:clamp(30px,6vw,46px);line-height:1.08;letter-spacing:-.02em;color:var(--petrol-x);margin:0 0 12px}
.intro .lead{font-size:clamp(16px,2.2vw,18px);max-width:60ch;margin:0 0 6px;color:var(--body)}

/* ── выбор класса ── */
.pick{margin:22px 0 0}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{background:#fff;border:1px solid var(--hair);color:var(--ink);font-family:var(--g);font-weight:500;
              font-size:14.5px;line-height:1.2;padding:9px 16px;border-radius:999px;cursor:pointer;
              box-shadow:0 1px 3px rgba(20,60,54,.05);transition:transform .12s ease,box-shadow .12s ease}
.pills button:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(20,60,54,.10)}
.pills button[aria-pressed="true"]{background:var(--petrol);color:#fff;border-color:var(--petrol);font-weight:600}
.pills button small{display:block;font-weight:400;font-size:11.5px;opacity:.75;margin-top:2px}

/* ── карточка расписания ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px 28px;margin:26px auto;
      box-shadow:0 12px 44px rgba(20,60,54,.07)}
@media(max-width:600px){.card{padding:22px 16px;border-radius:18px;margin:18px auto}}
.cls-head h2{font-size:clamp(24px,4.4vw,32px);letter-spacing:-.01em}
.cls-head .age{display:block;color:var(--muted);font-size:15px;margin:4px 0 0}
.cls-staff{margin:12px 0 16px;font-size:15px;color:var(--body)}
.cls-staff b{font-weight:600;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 18px;font-size:13.5px;color:var(--muted);align-items:center}
.chip{display:inline-block;font-family:var(--g);font-weight:600;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;
      padding:2px 8px;border-radius:999px;line-height:1.45;vertical-align:middle}
.chip.ru{background:var(--ru-bg);color:var(--ru-fg)}
.chip.en{background:var(--en-bg);color:var(--en-fg)}
.tools{display:flex;margin:18px 0 0}
.btn{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--hair);border-radius:12px;
     color:var(--petrol);font-family:var(--g);font-weight:600;font-size:14px;padding:9px 16px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--mint)}
.btn .i{width:17px;height:17px}

/* ── сетка недели (десктоп): CSS-grid, клетки-карточки ── */
.wk-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.wk{display:grid;grid-template-columns:96px repeat(5,minmax(150px,1fr));gap:6px;min-width:840px}
.wk .dh{text-align:center;background:var(--petrol);color:#fff;font-family:var(--g);font-weight:600;font-size:13.5px;letter-spacing:.3px;
        padding:10px 8px;border-radius:12px}
.wk .dh.tm{background:transparent}
.wk .tc{text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;padding:8px 6px;
        border-radius:12px;background:var(--brk);font-family:var(--g);font-weight:600;font-size:12.5px;color:var(--petrol-d)}
.wk .tc small{font-weight:400;font-size:11px;color:var(--muted)}
.wk .les{text-align:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 9px 10px;display:flex;
         flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:84px}
.wk .les .s{font-family:var(--g);font-weight:600;font-size:14px;line-height:1.25;color:var(--ink)}
.wk .les .w{font-size:12px;line-height:1.35;color:var(--muted)}
.wk .fr{text-align:center;grid-column:2/-1;border-radius:12px;padding:9px 14px;display:flex;align-items:center;justify-content:center;
        gap:9px;flex-wrap:wrap;font-size:14px;color:var(--body)}
.wk .fr .i{width:17px;height:17px;fill:var(--petrol)}
.wk .fr b{font-family:var(--g);font-weight:600;color:var(--ink)}
.wk .fr .d{color:var(--muted);font-size:13px}
.wk .fr.mini{padding:5px 14px;font-size:13px}
.wk .fr.mini b{font-weight:500;color:var(--body)}
.wk .tc.mini{padding:4px 6px;font-size:12px;font-weight:500;color:var(--muted);background:transparent}
.wk .fr.meal{background:var(--meal)} .wk .fr.calm{background:var(--calm)} .wk .fr.hw{background:var(--hw)}
.wk .fr.play{background:var(--play)} .wk .fr.brk{background:var(--brk)}
.wk .les.hw{background:var(--hw);border-color:#d5e5e0}
.wk .fr.light{background:transparent;border:1.5px dashed #e6c79a;color:var(--muted);font-size:13px;padding:6px 14px}
.wk .fr.light b{color:#b3501d}
.wk .tc.light{background:transparent;color:#b3501d}

/* ── по дням (мобильный) ── */
.days{display:none}
.daytabs{display:flex;gap:6px;margin:0 0 12px}
.daytabs button{flex:1 1 0;background:#fff;border:1px solid var(--hair);border-radius:10px;font-family:var(--g);
                font-weight:500;font-size:14px;padding:9px 4px;color:var(--body);cursor:pointer}
.daytabs button[aria-pressed="true"]{background:var(--petrol);color:#fff;border-color:var(--petrol);font-weight:600}
.dl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.dl li{display:grid;grid-template-columns:82px 1fr;gap:10px;align-items:center;
       background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.dl .tm{font-family:var(--g);font-weight:600;font-size:12.5px;color:var(--petrol-d);line-height:1.3}
.dl .tm small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.dl .s{display:block;font-family:var(--g);font-weight:600;font-size:15px;color:var(--ink);line-height:1.3}
.dl .w{display:block;font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:2px}
.dl li.fr{border-color:transparent}
.dl li.fr .tm{color:var(--muted);font-weight:500}
.dl li.fr .f{display:grid;grid-template-columns:16px 1fr;gap:0 8px;align-items:center;color:var(--body);font-size:14px}
.dl li.fr .f .i{width:16px;height:16px;fill:var(--petrol)}
.dl li.fr .f b{font-family:var(--g);font-weight:600;color:var(--ink)}
.dl li.fr .f .d{grid-column:2;color:var(--muted);font-size:12.5px;line-height:1.35}
.dl li.meal{background:var(--meal)} .dl li.calm{background:var(--calm)} .dl li.hw{background:var(--hw)}
.dl li.play{background:var(--play)} .dl li.brk{background:var(--brk);padding:6px 12px}
.dl li.brk .f b{font-weight:500;color:var(--body)}
.dl li.light{background:transparent;border:1.5px dashed #e6c79a;color:var(--muted);font-size:13px;padding:7px 12px}
.dl li.light b{color:#b3501d}
@media(max-width:760px){.week{display:none}.days{display:block}}

/* ── кто ведёт ── */
.two{display:grid;grid-template-columns:1fr;gap:14px;margin:18px 0 0}
@media(min-width:720px){.two{grid-template-columns:1fr 1fr}}
.col{background:var(--paper);border-radius:18px;padding:18px 20px}
.col h3{font-size:16px;display:flex;align-items:center;gap:9px;margin:0 0 8px}
.col ul{list-style:none;margin:0;padding:0}
.col li{padding:9px 0;border-top:1px solid var(--hair);display:grid;grid-template-columns:1fr;gap:1px}
.col li:first-child{border-top:0}
.col .s{font-family:var(--g);font-weight:600;font-size:15px;color:var(--ink)}
.col .w{font-size:13.5px;color:var(--muted);line-height:1.4}
.sec h2{font-size:clamp(22px,4vw,28px);letter-spacing:-.01em;margin:0 0 4px}
.sec .sub{color:var(--muted);font-size:15px;margin:0}
.sec .note{color:var(--muted);font-size:13.5px;margin:16px 0 0;max-width:70ch}

/* ── что важно знать ── */
.bul{list-style:none;margin:18px 0 0;padding:0;max-width:760px;display:grid;gap:12px}
.bul li{position:relative;padding-left:22px;font-size:15.5px;line-height:1.55;color:var(--body)}
.bul li::before{content:"";position:absolute;left:0;top:10px;width:9px;height:9px;border-radius:50%;background:var(--mint)}
.bul b{color:var(--ink);font-weight:600}

/* ── подвал ── */
.foot{padding:10px 0 40px;color:var(--muted);font-size:14px}
.foot .logo{height:30px;width:auto;display:inline-block;opacity:.9;margin:0 0 10px}
.contacts{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 12px}
.contact{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border-radius:12px;padding:10px 15px;
         font-weight:600;font-size:14px;color:var(--ink);border:1px solid var(--hair);background:#fff}
.contact .i{width:18px;height:18px}
.c-wa .i{fill:#1fa855} .c-tg .i{fill:#2aa0da} .c-tel .i{fill:var(--petrol)}

@media print{
  .langsw,.pick,.tools,.days,.foot .contacts{display:none !important}
  .week{display:block !important}
  body{background:#fff}
  .card{box-shadow:none;border:0;padding:0;margin:0 0 8px;page-break-inside:avoid}
  .wk{min-width:0;gap:4px}
  .wk .les{min-height:0;padding:5px 4px}.wk .les .s{font-size:10.5px}.wk .les .w{font-size:9px}
  .wk .fr{padding:4px 8px;font-size:11px}.wk .tc{font-size:10.5px;padding:3px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 landscape;margin:9mm}
}
</style>
</head>

  const keys = ["n1","n2","n3","n4"];
  if (c.light) keys.push("n5");
  if (CUR.startsWith("Y3")) keys.push("n6");
  document.getElementById("notes").innerHTML =
    `<h2>${t("notes_h")}</h2><ul class="bul">` + keys.map(k => `<li>${t(k)}</li>`).join("") + `</ul>`;
}
function renderPills(){
  document.getElementById("pills").innerHTML = CLASSES.map(k => {
    const c = DATA[k];
    return `<button type="button" aria-pressed="${k === CUR}" onclick="setClass('${k}')">${L() ? c.label_en : c.label}<small>${c.age} ${t("years")}</small></button>`;
  }).join("");
}
function applyLang(){
  document.documentElement.lang = LANG;
  document.title = LANG === "en" ? "Class timetable — Kinderville Nova, Year 2–6" : "Расписание класса — Kinderville Nova, Year 2–6";
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = t(el.dataset.t); });
  document.getElementById("lang-ru").setAttribute("aria-pressed", LANG === "ru");
  document.getElementById("lang-en").setAttribute("aria-pressed", LANG === "en");
}
function pushUrl(){
  const p = new URLSearchParams(); p.set("class", CUR); if (LANG === "en") p.set("lang", "en");
  history.replaceState(null, "", "?" + p.toString());
}
function setLang(l){ LANG = l; applyLang(); renderPills(); renderClass(); pushUrl(); }
function setClass(k){ CUR = k; renderPills(); renderClass(); pushUrl();
  const y = document.getElementById("sched").getBoundingClientRect().top + window.scrollY - 16;
  if (window.scrollY > y) window.scrollTo({top: y, behavior: "smooth"}); }
function setDay(i){ DAY = i; renderClass(); }
applyLang(); renderPills(); renderClass();
</script>
</body>
</html>
