:root {
  --cream:#FBF7F0; --paper:#FFFFFF; --ink:#34403C; --mute:#6B7570; --soft:#A7B0AB; --line:#E7E0D3;
  --petrol:#1C7066; --teal:#36A393; --sun:#FFCB05; --honey:#FFE9A3; --tang:#F68C50; --tangbg:#FDEBDD; --tile:#F4EEE2;
  --r:20px;
}
* { box-sizing:border-box; }
html, body { margin:0; }
html { -webkit-text-size-adjust:100%; text-size-adjust:100%; touch-action:manipulation; }
button, a, .k { -webkit-tap-highlight-color:transparent; }
.wrap { padding-top:max(24px, env(safe-area-inset-top)); padding-left:max(28px, env(safe-area-inset-left)); padding-right:max(28px, env(safe-area-inset-right)); padding-bottom:max(28px, env(safe-area-inset-bottom)); }
body { background:var(--cream); color:var(--ink); font:400 17px/1.45 "Geologica", -apple-system, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing:antialiased; }
.wrap { max-width:1140px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; }
header img { height:34px; width:auto; display:block; }
header .tagline { font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); font-weight:500; }
main { flex:1; align-content:start; display:grid; grid-template-columns:minmax(0,1fr) 270px; gap:28px; align-items:start; }
main > section { grid-column:1; grid-row:1; min-width:0; }
footer { margin-top:36px; font-size:11.5px; color:var(--soft); line-height:1.5; }
button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; }
button:disabled { cursor:default; }
[hidden] { display:none !important; }

/* ---------- старт ---------- */
.hero { max-width:820px; }
.title { display:flex; align-items:center; gap:18px; margin:4px 0 10px; }
.title img { width:76px; height:76px; }
h1 { font-weight:700; font-size:48px; line-height:1; letter-spacing:-.02em; margin:0; }
.lead { font-size:19px; color:var(--mute); margin:0 0 26px; max-width:30em; }
.lead b { color:var(--ink); font-weight:600; }
.warn.soft { background:#F1EBDF; color:var(--mute); }
.warn { background:var(--tangbg); color:#9A4A1C; border-radius:14px; padding:12px 16px; margin:0 0 20px; font-size:15px; }
.modes { display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start; }
.mode { text-align:left; background:var(--paper); border-radius:var(--r); padding:18px 20px 16px; box-shadow:0 1px 0 var(--line), 0 0 0 1px var(--line) inset; transition:transform .12s, box-shadow .12s; display:flex; flex-direction:column; gap:2px; min-height:96px; }
.mode:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 6px 18px rgba(52,64,60,.10), 0 0 0 1px var(--line) inset; }
.mode b { font-size:20px; font-weight:600; }
.mode span { font-size:14.5px; color:var(--mute); }
.mode.main { background:var(--petrol); color:#fff; box-shadow:none; }
.mode.main span { color:rgba(255,255,255,.78); }
.mode:disabled { opacity:.45; }
.mode:focus-visible, .btn:focus-visible, .chip:focus-visible { outline:3px solid var(--sun); outline-offset:2px; }
.hive { grid-column:2; grid-row:1; position:sticky; top:20px; background:var(--paper); border-radius:24px; padding:20px 20px 16px; box-shadow:0 0 0 1px var(--line) inset; }
.hive polygon.cur { stroke:var(--petrol); stroke-width:2.2; }
.hive polygon.fill { transform-box:fill-box; transform-origin:center; animation:pop .5s ease-out both; }
.hive .hv-head { display:flex; flex-direction:column; }
.hive h2 { font-size:15px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); margin:0 0 4px; }
.hive .count { font-size:38px; font-weight:700; line-height:1.1; }
.hive .count small { font-size:17px; font-weight:400; color:var(--mute); }
.hive svg { width:100%; height:auto; display:block; margin:14px auto 0; }
.hive .next { font-size:14.5px; color:var(--ink); margin:12px 0 0; font-weight:500; }
.hive .rec { font-size:13.5px; color:var(--mute); margin:6px 0 0; }
.recs { list-style:none; padding:0; margin:12px 0 0; }
.recs li { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:15px; }
.recs li .r { font-weight:600; display:inline-flex; align-items:center; gap:6px; font-variant-numeric:tabular-nums; }
.recs li img { width:20px; height:20px; }
.recs li small { font-weight:400; color:var(--mute); font-size:12.5px; }
.track { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin-top:14px; position:relative; }
.track::before { content:""; position:absolute; left:12%; right:12%; top:17px; height:3px; background:#EFE8DA; border-radius:2px; }
.track .st { display:flex; flex-direction:column; align-items:center; gap:2px; position:relative; font-size:12px; color:var(--soft); }
.track .dot { width:36px; height:36px; border-radius:50%; background:#F1EBDF; display:flex; align-items:center; justify-content:center; }
.track .dot img, .track .dot svg { width:22px; height:22px; opacity:.35; filter:grayscale(1); }
.track b { text-align:center; line-height:1.15; }
.track b { font-weight:500; }
.track small { font-size:11px; }
.track .st.on { color:var(--ink); }
.track .st.on .dot { background:var(--honey); box-shadow:0 0 0 2px var(--sun) inset; }
.track .st.on .dot img, .track .st.on .dot svg { opacity:1; filter:none; }
.hive p { font-size:14px; color:var(--mute); margin:10px 0 0; }

.story { display:grid; grid-template-columns:minmax(0,1fr) 270px; gap:22px; align-items:center; background:var(--paper); border-radius:24px; padding:16px 16px 16px 24px; box-shadow:0 0 0 1px var(--line) inset; margin:16px 0 20px; }
.story p { margin:0 0 8px; font-size:16px; line-height:1.5; color:var(--mute); }
.story .task { color:var(--ink); font-weight:500; }
.story .task { margin:0; }
.scene { position:relative; aspect-ratio:16/10; width:100%; border-radius:18px; overflow:hidden; background:radial-gradient(circle at 68% 30%, #FFF0B8 0, #FFF7DE 38%, #FBF7F0 75%); }
.scene > * { position:absolute; display:block; }
.scene svg.path { inset:0; width:100%; height:100%; } .scene div svg { width:100%; height:auto; display:block; }
.hive .ico, .recs .ico { display:inline-flex; width:20px; height:20px; } .ico img, .ico svg { width:100%; height:100%; }
.sent { font-size:19px; line-height:1.45; color:var(--ink); margin:0 0 12px; }
.sent .gap { display:inline-block; width:3.2em; height:.95em; vertical-align:-.12em; border-bottom:3px solid var(--sun); background:#FFF6D6; border-radius:4px 4px 0 0; margin:0 2px; }
.sent b { color:var(--petrol); font-weight:700; }
.tag .posl { display:inline-block; font-size:11.5px; font-weight:500; letter-spacing:.02em; text-transform:lowercase; color:var(--soft); background:none; padding:0; margin-right:6px; }  /* часть речи — справка, в глаза не бросается */
.hive .mini { display:flex; align-items:center; gap:4px; margin-top:6px; font-size:13px; color:var(--mute); }
.hive .mini svg { width:13px !important; height:auto; margin:0 0 0 6px !important; display:inline-block; } .hive .mini svg:first-child { margin-left:0 !important; }
.toasts { position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:60; pointer-events:none; display:flex; flex-direction:column; align-items:center; gap:8px; }
.toast { display:flex; align-items:center; gap:10px; background:#fff; color:var(--ink); border-radius:999px; padding:8px 18px 8px 10px; font-weight:600; font-size:16px; box-shadow:0 0 0 2px var(--honey), 0 8px 24px rgba(52,64,60,.16); animation:tin .3s ease-out both; }
.toast img, .toast .ico { width:28px; height:28px; display:inline-flex; }
.toast.big { font-size:20px; padding:12px 24px 12px 14px; background:var(--honey); box-shadow:0 0 0 2px var(--sun), 0 10px 30px rgba(52,64,60,.2); }
.toast.big img, .toast.big .ico { width:40px; height:40px; }
.hive .ico svg, .toast .ico svg, .recs .ico svg { margin:0 !important; display:block; }
.toast.out { opacity:0; transform:translateY(-8px); transition:all .3s; }
@keyframes tin { from { opacity:0; transform:translateY(-12px) scale(.96) } to { opacity:1; transform:none } }
.top .prevb { color:var(--petrol); box-shadow:0 0 0 1.5px #BFDCD6 inset; font-weight:500; }
.top .prevb:disabled { opacity:.4; }
.card.rev { background:#FFFCF3; }
.rlabel { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); font-weight:600; margin-bottom:10px; }
.rword { font-size:52px; font-weight:700; color:var(--petrol); letter-spacing:.02em; line-height:1.1; margin:4px 0 22px; }
.rrow { display:flex; gap:10px; flex-wrap:wrap; }
.rrow .btn:disabled { opacity:.35; }
.rrow .go { margin-left:auto; }
#mainCard { position:relative; }
.introbox { position:absolute; top:14px; right:16px; display:flex; flex-direction:column; align-items:flex-end; gap:6px; z-index:2; max-width:260px; }
.introbtn svg { width:16px; height:16px; flex:none; }
.introbtn { display:inline-flex; align-items:center; gap:5px; font:500 14px/1 "Geologica", sans-serif; color:var(--mute); background:transparent; border-radius:999px; padding:8px 12px; box-shadow:0 0 0 1px var(--line) inset; }
.introbtn.armed { color:#fff; background:var(--petrol); box-shadow:none; }
.introwarn { font-size:13px; line-height:1.35; color:var(--ink); background:#EAF4F1; border-radius:12px; padding:8px 12px; text-align:right; }
.ru { font-size:18px; color:var(--ink); background:#EAF4F1; border-radius:12px; padding:6px 12px; margin:-4px 0 12px; display:inline-block; }
.ru span { color:var(--mute); font-size:14px; }
.rru { margin:-10px 0 18px; }
body.vkmode .ru { font-size:16px; margin:-2px 0 8px; }
.lvlnote { margin:6px 0 0; font-size:14px; color:var(--mute); }
.lvltag { display:inline-block; font-size:12px; color:var(--petrol); background:#E7F2EF; border-radius:999px; padding:2px 10px; margin-left:6px; }
.mwrap { display:flex; flex-direction:column; gap:6px; } .mwrap .mode { flex:1; }
.mlist { font-size:14px; color:var(--petrol); font-weight:500; text-align:left; padding:4px 6px; }
.mlist:disabled { opacity:.4; }
.hright { display:flex; align-items:center; gap:14px; }
.whochip { font-weight:600; color:var(--petrol); }
body.solo main { grid-template-columns:minmax(0,1fr); } body.solo .hive { display:none; }
.adults { margin-top:26px; font-size:13px; color:var(--soft); text-decoration:underline; text-underline-offset:3px; }
#who { max-width:560px; }

  .wrap { padding-top:max(10px, env(safe-area-inset-top)); padding-left:max(14px, env(safe-area-inset-left)); padding-right:max(14px, env(safe-area-inset-right)); padding-bottom:max(14px, env(safe-area-inset-bottom)); }
  body { font-size:16px; }
  header, body.vkmode header { margin-bottom:12px; } header img, body.vkmode header img { height:26px; }
  header .tagline { display:none; }
  .whochip { font-size:15px; padding:6px 0 6px 10px; }
  h1 { font-size:36px; }
  main { gap:12px; }
  body:not([data-view="play"]) main > section { grid-row:1; } body:not([data-view="play"]) .hive { grid-row:2; }
  .hive { padding:10px 12px; }
  body[data-view="play"] .hive .hsmall, body[data-view="play"] .hive .mini { display:none; }
  .top, body.vkmode .top { gap:8px; margin-bottom:10px; }
  .top .chip { font-size:14px; padding:7px 11px 7px 8px; white-space:nowrap; } .top .chip svg { width:18px; height:18px; }
  .top #pos { min-width:0; font-size:14px; white-space:nowrap; }
  .card, body.vkmode .card { grid-template-columns:112px minmax(0,1fr); gap:6px 12px; padding:12px; border-radius:22px; text-align:left; justify-items:stretch; align-items:start; position:relative; }
  .card .side { display:contents; }
  .pic, body.vkmode .pic { width:112px; height:112px; border-radius:16px; grid-column:1; grid-row:span 3; }
  .pic img, body.vkmode .pic img { width:80px; height:80px; } .pic.many, body.vkmode .pic.many { padding:8px; gap:2px 4px; } .pic.many img, body.vkmode .pic.many img { width:44px; height:44px; }
  .pic .num, body.vkmode .pic .num { font-size:52px; } .pic .sw { width:56px; height:56px; box-shadow:0 0 0 5px rgba(255,255,255,.7); }
  .pic.blank svg { width:40px; height:40px; } .pic.blank .cap { font-size:11px; }
  .speak, .tag, .sent, .rlabel, body.vkmode .speak { grid-column:2; justify-content:flex-start; margin:0; }
  .speak .btn { padding:8px 14px; font-size:15px; } .speak .btn img { width:22px; height:22px; }
  .sent, body.vkmode .sent { font-size:16px; line-height:1.35; margin:0; }
  .ru, .field, .fb, .card .row, .kb, .rword, .rru, .rrow { grid-column:1 / -1; }
  .introbox { position:static; grid-column:1 / -1; align-items:flex-end; max-width:none; margin:-2px 0 2px; }
  input, body.vkmode .mirror { font-size:28px; padding:10px 14px; } input { border-radius:14px; }
  .fb, body.vkmode .fb { min-height:60px; margin:4px 0 0; }

  .fb .right, body.vkmode .fb .right { font-size:30px; overflow-wrap:anywhere; }
  .fb .note { font-size:14px; }
  body.vkmode .kb { gap:6px; margin-top:4px; } .kr { gap:4px; } .kr .sp { flex:.4; }
  .k { height:46px; border-radius:9px; font-size:20px; } .k.wide { font-size:17px; } .kr #go { height:46px; font-size:16px; border-radius:9px; }
  .btn { padding:10px 16px; font-size:16px; } .btn.go { padding:12px 22px; font-size:17px; }
  .rrow { flex-wrap:wrap; gap:8px; }
  .wform input { font-size:17px; } #csvArea { font-size:16px; }

  .wtitle { font-size:20px; }

  #words .top { flex-wrap:wrap; } #words .top .wtitle { order:3; flex:1 1 100%; margin:2px 0 0; } #words .top #wall { padding:8px 14px; font-size:15px; }
  footer { margin-top:20px; font-size:10.5px; }
}
/* ---- телефон: экран слова целиком в видимой области; запас снизу под панели браузера ---- */
.pstrip, .helprow, .plaque { display:none; }
.cta { display:inline-flex; justify-content:center; font-size:19px; padding:18px 30px; border-radius:18px; margin:18px 0 22px; }
.cta[hidden] { display:none; }
#home .modes { margin-top:22px; }
#hivepage .hivebig { position:static; max-width:420px; }
@media (max-width:600px) {
  .hive:not(.hivebig) { display:none !important; }
  main { grid-template-columns:minmax(0,1fr); }
  body[data-view="play"] header, body[data-view="play"] footer { display:none; }
  body[data-view="play"] .wrap { padding-bottom:calc(90px + env(safe-area-inset-bottom)); min-height:0; }
  body[data-view="play"] main > section { grid-row:1; }
  /* верхняя строка: стрелка выхода · соты шага · мёд */
  #play .top { gap:10px; margin-bottom:8px; min-height:40px; }
  #quit { width:40px; height:40px; padding:0; justify-content:center; flex:none; } #quit span { display:none; } #quit svg { width:22px; height:22px; }
  .pstrip { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
  .pstrip .pcells { flex:1; min-width:0; } .pstrip .pcells svg { width:100%; max-width:260px; height:auto; max-height:26px; display:block; margin:0; }
  .pstrip .pcells.two svg { max-height:40px; max-width:190px; }
  .pstrip polygon.cur { stroke:var(--petrol); stroke-width:2.2; }
  .pstrip polygon.fill { transform-box:fill-box; transform-origin:center; animation:pop .5s ease-out both; }
  .pstrip .phoney { display:flex; align-items:baseline; gap:3px; white-space:nowrap; font-size:13px; color:var(--mute); } .pstrip .phoney svg { width:12px; height:auto; align-self:center; margin:0 2px 0 0; } .pstrip .phoney b { font-size:16px; color:var(--ink); font-weight:600; }
  #play .top > span[style] { display:none; }
  body.fewcells #play .top #pos { display:none; }
  /* карточка слова */
  #mainCard { --p: var(--pic, 132px); grid-template-columns:var(--p) minmax(0,1fr) 44px; grid-template-areas:"help help help" "pic tag spk" "pic sent sent" "pic ru ru" "fld fld fld" "kb kb kb"; gap:6px 12px; padding:10px 12px 12px; align-items:start; }
  #mainCard > .pic { grid-area:pic; width:var(--p); height:var(--p); }
  #mainCard .pic img { width:calc(var(--p) * .7); height:calc(var(--p) * .7); } #mainCard .pic.many img { width:calc(var(--p) * .39); height:calc(var(--p) * .39); }
  #mainCard .pic .num { font-size:calc(var(--p) * .46); }
  #mainCard .speak { grid-area:spk; justify-self:end; } #mainCard .tag { grid-area:tag; align-self:center; min-height:0; } #mainCard .sent { grid-area:sent; } #mainCard .ru { grid-area:ru; justify-self:start; margin:0; font-size:16px; }
  #mainCard .frow { grid-area:fld; display:flex; gap:8px; align-items:stretch; } #mainCard .frow .field { flex:1; min-width:0; }
  #mainCard .frow #go { flex:none; height:auto; min-height:52px; padding:0 16px; border-radius:14px; font-size:16px; }
  #mainCard .kb { grid-area:kb; }
  #again { width:44px; height:44px; padding:0; justify-content:center; border-radius:50%; } #again span { display:none; } #again img { width:24px; height:24px; }
  body.vkmode .kb { margin-top:2px; }
  .k, .kr #go { height:var(--kh, 52px); }
  /* строка помощи: «Прошлое слово» и «Не знаю слово» — маленькие значки с подписью */
  .helprow { grid-area:help; display:flex; align-items:center; gap:8px; position:relative; min-height:32px; }
  .helprow .chip, .helprow .introbtn { display:inline-flex; align-items:center; gap:5px; font:500 13px/1 "Geologica", sans-serif; padding:7px 11px 7px 8px; border-radius:999px; background:var(--paper); color:var(--mute); box-shadow:0 0 0 1px var(--line) inset; white-space:nowrap; }
  .helprow .chip svg, .helprow .introbtn svg { width:17px; height:17px; }
  .helprow .prevb { color:var(--petrol); box-shadow:0 0 0 1.5px #BFDCD6 inset; } .helprow .prevb:disabled { opacity:.4; }
  .helprow .introbtn.armed { color:#fff; background:var(--petrol); box-shadow:none; }
  .helprow .introbox { position:static; display:block; max-width:none; margin:0; }
  .helprow .introwarn { position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:4; text-align:left; box-shadow:0 8px 24px rgba(52,64,60,.16); font-size:14px; }
  /* разбор и «Верно!» — поверх предложения, без сдвига вёрстки */
  #mainCard .fb { grid-area:2 / 2 / 5 / 4; position:relative; z-index:3; background:var(--paper); margin:0; min-height:0; display:flex; flex-direction:column; justify-content:center; overflow:hidden; }
  #mainCard .fb:empty { display:none; }
  #mainCard .fb { align-self:stretch; } #mainCard .fb:has(.yes) { grid-area:2 / 2 / 3 / 4; justify-content:flex-start; }
  #mainCard .fb .yes { padding-top:0; font-size:20px; } #mainCard .fb .label { font-size:13px; }
  #mainCard .fb .right { font-size:26px; line-height:1.15; } #mainCard .fb .note { font-size:13px; line-height:1.3; }
  /* старт: одна главная кнопка, улей — плашкой */
  .plaque { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--paper); border-radius:18px; box-shadow:0 0 0 1px var(--line) inset; padding:8px 12px; margin:6px 0 12px; }
  .plaque .pl-ico { width:44px; height:44px; flex:none; border-radius:50%; background:var(--honey); display:flex; align-items:center; justify-content:center; } .plaque .pl-ico img { width:28px; height:28px; }
  .plaque .pl-t { flex:1; display:flex; flex-direction:column; } .plaque small { font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); font-weight:600; } .plaque b { font-size:17px; font-weight:600; }
  .plaque > svg { width:22px; height:22px; color:var(--soft); }
  .cta { display:flex; width:100%; justify-content:center; font-size:19px; padding:18px 20px; border-radius:18px; margin:0 0 18px; }
  .cta[hidden] { display:none; }
  #home .hero > div { display:flex; flex-direction:column; }
  #home h1 { order:0; } #home .lvlnote { order:1; margin-bottom:4px; } #home .warn { order:2; } #home .plaque { order:3; } #home .cta { order:4; }
  #home .levels { order:5; margin-top:0; } #home .modes { order:6; margin-top:22px; } #home .story { order:7; margin-top:22px; } #home .adults { order:8; }
  #home .modes .mode.main { background:var(--paper); color:var(--ink); box-shadow:0 0 0 1px var(--line) inset; } #home .modes .mode.main span { color:var(--mute); }
  .mode { min-height:0; padding:14px 16px; }
  /* финал шага: результат и следующий шаг; остальное ниже */
  .done .round { display:none; }
  .doneart { display:block; order:3; margin:6px 0 0; } .doneart .hart { max-width:340px; }
  .done .news { order:4 !important; font-weight:600; color:var(--petrol); }
  .done > div { display:flex; flex-direction:column; }
  .done .dtitle { order:0; } .done .big { order:1; } #stepCellsDone { order:2; } .done .row { order:5; flex-wrap:wrap; gap:8px; margin-top:18px !important; }
  #plaque2 { order:6; margin-top:16px; } .done .grow { order:7; margin-top:16px; } .done .rec { order:7; } .done .marks { order:8; } #trickyBox { order:9; }
  /* экран «Наш улей» */
  #hivepage .hivebig { display:block; padding:16px; border-radius:22px; }
  #hivepage .hivebig .hv-body { display:block; } #hivepage .hivebig svg { max-height:none; margin:10px auto 0; }
  #hivepage .hivebig .track { display:grid; } #hivepage .hivebig h2 { font-size:13px; } #hivepage .hivebig .next { font-size:14.5px; margin-top:12px; }
  /* слова: компактнее */
  .wr { gap:2px 12px; padding:8px 12px; } .wr .ww { font-size:24px; padding:2px 0; } .wr .wsent { font-size:15px; } .wr .wtr { padding:5px 10px; font-size:12.5px; }
}
@media (max-width:370px) { .k { font-size:18px; } .kr { gap:3px; } .top .prevb span { font-size:13px; } h1 { font-size:32px; } }

    if (t === 0) { missed.push(cur.n); learnAfter(store, cur.n, false, today()); save(); }
    renderSent(cur, false);
    $("fb").innerHTML = `<div class="note task homo">${T.homoLine}</div>`;
    say([cur.s], 0.85); readyInput(); renderHive(); return;
  }
  updIntro(true);
  if (introWrite[cur.n]) {   // знакомство: пишет без мёда; верно — слово вернётся через 3–5, неверно — списывание, потом так же
    if (r === "ok") { delete introWrite[cur.n]; queue.splice(returnPos(queue.length, 1, Math.random()), 0, cur); markSeen(cur.n); return showOk(T.introDone); }
    phase = "copy"; showCopy(r, inp.value); renderHive(); return;
  }
  if (r === "ok") {

  if (t === 0) { missed.push(cur.n); learnAfter(store, cur.n, false, today()); save(); }
  if (t + 1 >= 3) hard.push(cur.n);
  phase = "copy";
  showCopy(r, inp.value);
  renderHive();
}

/* ---------- профили, журнал попыток, статистика и выгрузка CSV (всё только на этом устройстве) ---------- */
const LOG_MAX = 3000;

const pad2 = v => String(v).padStart(2, "0");
